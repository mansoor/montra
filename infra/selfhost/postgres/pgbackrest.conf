# pgBackRest for the self-hosted stack (ADR-0050 §7). The bucket, its keys and the passphrase are written to
# conf.d/repo.conf by entrypoint.sh at start, from the environment and /run/secrets.
[global]
repo1-type=s3
repo1-path=/montra
# Four weekly full backups, with daily differentials between them, and the WAL to go back to any moment since the
# oldest. Object lock on the bucket must be shorter than this (docs/runbooks/selfhost-backups.md).
repo1-retention-full-type=count
repo1-retention-full=4
# Encrypted before it leaves the server. The passphrase is backed up offline with the master key.
repo1-cipher-type=aes-256-cbc
compress-type=zst
start-fast=y
process-max=2
# The WAL is pushed from a local queue, so a slow upload never holds up the database.
archive-async=y
spool-path=/var/spool/pgbackrest
archive-push-queue-max=4GiB
log-level-console=info
log-level-file=info
log-path=/var/log/pgbackrest

[montra]
pg1-path=/var/lib/postgresql/data
