# Ory Kratos configuration for Montra (ADR-0006). Local/dev values; production overrides URLs, secrets,
# SMTP and OIDC client credentials through environment variables (e.g. SECRETS_COOKIE, COURIER_SMTP_CONNECTION_URI).
version: v26.2.0

dsn: memory # overridden by DSN env (Postgres database `kratos`, separate from the ledger)

serve:
  public:
    # Browsers and the phone reach Kratos only through the auth gateway (AUTH-08, ADR-0042), so the URLs Kratos puts
    # in flows (form actions, redirects) are the gateway's. Its own port 4433 is for the gateway and the API.
    base_url: http://localhost:4455/
    cors:
      enabled: true
      allowed_origins: [http://localhost:3000]
      allow_credentials: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost:3000/
  allowed_return_urls: [http://localhost:3000]

  methods:
    password:
      enabled: true
      config:
        # AUTH-02: NIST SP 800-63B — length over complexity, breached-password check, no forced resets.
        min_password_length: 12
        haveibeenpwned_enabled: true
        max_breaches: 0
        identifier_similarity_check_enabled: true
    passkey:
      enabled: true
      config:
        rp: { display_name: Montra, id: localhost, origins: [http://localhost:3000] }
    webauthn:
      enabled: true
      config:
        passwordless: false
        rp: { display_name: Montra, id: localhost, origins: [http://localhost:3000] }
    totp:
      enabled: true
      config: { issuer: Montra }
    lookup_secret:
      enabled: true # AUTH-04/06: single-use recovery codes
    code:
      enabled: true # email codes for verification and recovery
      config:
        lifespan: 30m # AUTH-05: single-use codes; the emails in templates/ state this number, keep them in step
    oidc:
      enabled: true
      config:
        providers: [] # Sign in with Apple / Google configured per environment (AUTH-01)

  flows:
    error: { ui_url: http://localhost:3000/auth/error }
    settings:
      ui_url: http://localhost:3000/settings/security
      privileged_session_max_age: 10m # AUTH-09
      required_aal: highest_available
      # AUTH-12 (ADR-0045): a password or two-step change is logged and emailed to the account's owner, and a new
      # password signs out the other devices.
      after:
        password:
          hooks:
            - hook: revoke_active_sessions
            - hook: web_hook
              config:
                url: http://host.docker.internal:4000/internal/kratos/hooks
                method: POST
                body: base64://ZnVuY3Rpb24oY3R4KSB7IGV2ZW50OiAncGFzc3dvcmRfY2hhbmdlZCcsIGlkZW50aXR5X2lkOiBjdHguaWRlbnRpdHkuaWQgfQ==
                auth:
                  type: api_key
                  config:
                    { name: x-montra-hook-secret, value: CHANGE-ME-hook-secret-at-least-32-chars, in: header }
        totp:
          hooks:
            - hook: web_hook
              config:
                url: http://host.docker.internal:4000/internal/kratos/hooks
                method: POST
                body: base64://ZnVuY3Rpb24oY3R4KSB7IGV2ZW50OiAnbWZhX2NoYW5nZWQnLCBpZGVudGl0eV9pZDogY3R4LmlkZW50aXR5LmlkIH0=
                auth:
                  type: api_key
                  config:
                    { name: x-montra-hook-secret, value: CHANGE-ME-hook-secret-at-least-32-chars, in: header }
        webauthn:
          hooks:
            - hook: web_hook
              config:
                url: http://host.docker.internal:4000/internal/kratos/hooks
                method: POST
                body: base64://ZnVuY3Rpb24oY3R4KSB7IGV2ZW50OiAnbWZhX2NoYW5nZWQnLCBpZGVudGl0eV9pZDogY3R4LmlkZW50aXR5LmlkIH0=
                auth:
                  type: api_key
                  config:
                    { name: x-montra-hook-secret, value: CHANGE-ME-hook-secret-at-least-32-chars, in: header }
        lookup_secret:
          hooks:
            - hook: web_hook
              config:
                url: http://host.docker.internal:4000/internal/kratos/hooks
                method: POST
                body: base64://ZnVuY3Rpb24oY3R4KSB7IGV2ZW50OiAnbWZhX2NoYW5nZWQnLCBpZGVudGl0eV9pZDogY3R4LmlkZW50aXR5LmlkIH0=
                auth:
                  type: api_key
                  config:
                    { name: x-montra-hook-secret, value: CHANGE-ME-hook-secret-at-least-32-chars, in: header }
    recovery:
      enabled: true
      ui_url: http://localhost:3000/auth/recovery
      use: code
      lifespan: 30m # AUTH-05
      notify_unknown_recipients: false # same response whether or not the email exists
      after:
        hooks:
          - hook: revoke_active_sessions # AUTH-05: sign out everywhere after a reset
          - hook: web_hook # tell the API to drop cached sessions immediately
            config:
              url: http://host.docker.internal:4000/internal/kratos/hooks # the API runs on the host locally
              method: POST
              body: base64://ZnVuY3Rpb24oY3R4KSB7IGV2ZW50OiAncmVjb3ZlcnknLCBpZGVudGl0eV9pZDogY3R4LmlkZW50aXR5LmlkIH0=
              auth:
                type: api_key
                config:
                  { name: x-montra-hook-secret, value: CHANGE-ME-hook-secret-at-least-32-chars, in: header }
    verification:
      enabled: true # AUTH-03
      ui_url: http://localhost:3000/auth/verification
      use: code
      lifespan: 24h
      after:
        default_browser_return_url: http://localhost:3000/welcome
    login:
      ui_url: http://localhost:3000/sign-in
      lifespan: 10m
    registration:
      ui_url: http://localhost:3000/sign-up
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session
            - hook: show_verification_ui

session:
  lifespan: 720h
  earliest_possible_extend: 24h
  cookie:
    name: ory_kratos_session
    same_site: Lax
    persistent: true
  whoami:
    required_aal: aal1 # the API applies AAL2 per role (owners, accountants), see WorkspaceGuard

# ADR-0046: the phone's recovery and settings flows answer with `continue_with` (its session token and the next
# flow) instead of asking it to open a browser. Browser flows still redirect as before.
feature_flags:
  use_continue_with_transitions: true

hashers:
  algorithm: argon2 # AUTH-02: Argon2id
  argon2:
    memory: 128MB
    iterations: 3
    parallelism: 2
    salt_length: 16
    key_length: 32

identity:
  default_schema_id: montra
  schemas:
    - id: montra
      url: file:///etc/config/kratos/identity.schema.json

courier:
  template_override_path: /etc/config/kratos/templates # recovery and verification emails (AUTH-05)
  smtp:
    connection_uri: smtp://mailpit:1025/?disable_starttls=true
    from_address: no-reply@montra.local
    from_name: Montra

secrets:
  cookie: [CHANGE-ME-local-cookie-secret-32chars-min]
  cipher: [CHANGE-ME-32-chars-cipher-key-xx] # exactly 32 characters, or Kratos refuses to start
  # CVE-2026-33503: unset, Kratos falls back to a publicly known default.
  pagination: [CHANGE-ME-local-pagination-secret]

ciphers:
  algorithm: xchacha20-poly1305

log:
  level: info
  leak_sensitive_values: false
