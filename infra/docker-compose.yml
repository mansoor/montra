# Local development dependencies: `docker compose -f infra/docker-compose.yml up -d`
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/bootstrap:ro
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-montra.sh:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: montra
      MINIO_ROOT_PASSWORD: montra-dev-secret
    ports: ['9000:9000', '9001:9001']
    volumes:
      - miniodata:/data
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']
volumes:
  pgdata:
  miniodata:
