# Local development dependencies: `docker compose -f infra/docker-compose.yml up -d`
# Host ports can be moved when another stack already uses them, e.g. MONTRA_PG_PORT=55433 (then point
# DATABASE_URL, DATABASE_ADMIN_URL, API_DATABASE_URL and API_DATABASE_ADMIN_URL at that port).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ['${MONTRA_PG_PORT:-5432}:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/bootstrap:ro
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-montra.sh:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
  redis:
    image: redis:7-alpine
    ports: ['${MONTRA_REDIS_PORT:-6379}:6379']
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: montra
      MINIO_ROOT_PASSWORD: montra-dev-secret
    ports: ['${MONTRA_MINIO_PORT:-9000}:9000', '${MONTRA_MINIO_CONSOLE_PORT:-9001}:9001']
    volumes:
      - miniodata:/data
  mailpit:
    image: axllent/mailpit:latest
    ports: ['${MONTRA_SMTP_PORT:-1025}:1025', '${MONTRA_MAILPIT_PORT:-8025}:8025']
  # Identity (ADR-0006). `docker compose --profile auth up -d` to run it locally.
  kratos-migrate:
    image: oryd/kratos:v1.3.1
    profiles: [auth]
    environment:
      DSN: postgres://postgres:postgres@postgres:5432/kratos?sslmode=disable
    command: migrate sql -e --yes
    volumes:
      - ./kratos:/etc/config/kratos:ro
    depends_on:
      postgres: { condition: service_healthy }
  kratos:
    image: oryd/kratos:v1.3.1
    profiles: [auth]
    environment:
      DSN: postgres://postgres:postgres@postgres:5432/kratos?sslmode=disable
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    ports: ['4433:4433', '4434:4434']
    volumes:
      - ./kratos:/etc/config/kratos:ro
    depends_on:
      kratos-migrate: { condition: service_completed_successfully }
volumes:
  pgdata:
  miniodata:
