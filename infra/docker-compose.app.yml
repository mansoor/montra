# Health checks run inside the images, which have node or python but no curl.
x-health: &health
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 30s

services:
  # Migrations and reference data, as `pnpm db:migrate` does. Run it after each pull, before `up`.
  migrate:
    <<: *app
    image: montra-dev/api:${MONTRA_IMAGE_TAG:-local}
    restart: 'no'
    profiles: [tools]
    environment:
      DATABASE_ADMIN_URL: postgres://montra_owner:montra_owner@postgres:5432/montra
    working_dir: /app/packages/db
    command: ['node', 'dist/cli.js', 'migrate']

  # Once, before Kratos: its database, if Postgres's volume is older than the line in infra/docker/postgres-init.sh
  # that makes it, and the secrets, generated once into the `authsecrets` volume and readable only by uid 1000.
  # (Kratos's cipher secret must be exactly 32 characters.)
  auth-init:
    image: postgres:16
    profiles: [auth]
    restart: 'no'
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes: [authsecrets:/secrets]
    command:
      - sh
      - -ec
      - |
        psql -tAc "select 1 from pg_database where datname = 'kratos'" | grep -q 1 || psql -c 'create database kratos'
        cd /secrets
        secret() { [ -s "$$1" ] || head -c "$$2" /dev/urandom | od -An -tx1 | tr -d ' \n' > "$$1"; }
        secret kratos_cookie_secret 32
        secret kratos_cipher_secret 16
        secret kratos_pagination_secret 32
        secret kratos_webhook_secret 32
        secret auth_gateway_secret 32
        chown 1000:1000 ./*
        chmod 0400 ./*
    depends_on:
      postgres: { condition: service_healthy }

  # Kratos's schema, after each pull (docker-compose.yml defines it).
  kratos-migrate:
    image: montra-dev/kratos:${MONTRA_IMAGE_TAG:-local}
    restart: 'no'
    depends_on:
      auth-init: { condition: service_completed_successfully }

  # Identity (ADR-0006), defined in docker-compose.yml. `serve --dev` there is what lets its cookies work over plain
  # http, fit for a development machine on a home network and nothing else. Only the gateway is published.
  kratos:
    image: montra-dev/kratos:${MONTRA_IMAGE_TAG:-local}
    restart: unless-stopped
    user: '1000:1000'
    environment: *kratos-environment
    volumes: [authsecrets:/run/secrets:ro]
    ports: !reset []
    healthcheck:
      test: ['CMD', 'montra-kratos', 'healthcheck']
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s

  # The only way in to Kratos from a browser or the phone (AUTH-08, ADR-0042), as self-hosting runs it. No CAPTCHA:
  # that needs a Turnstile key (ADR-0056), which this doesn't set.
  auth-gateway:
    <<: *app
    image: montra-dev/api:${MONTRA_IMAGE_TAG:-local}
    profiles: [auth]
    # Only what the gateway reads, not the whole .env.
    env_file: []
    environment:
      NODE_ENV: development
      AUTH_MODE: kratos
      AUTH_GATEWAY_PORT: '4455'
      AUTH_GATEWAY_SECRET_FILE: /run/secrets/auth_gateway_secret
      KRATOS_PUBLIC_URL: http://kratos:4433
      WEB_URL: http://${MONTRA_PUBLIC_HOST:-localhost}:${MONTRA_WEB_PORT:-3030}
      DATABASE_URL: postgres://montra_app:montra_app@postgres:5432/montra
      MAIL_MODE: smtp
      MAIL_URL: smtp://mailpit:1025
      TZ: ${MONTRA_TZ:-}
    command: ['node', 'dist/auth-gateway-main.js']
    ports: ['${MONTRA_AUTH_PORT:-4455}:4455']
    volumes: [authsecrets:/run/secrets:ro]
    healthcheck:
      <<: *health
      # Passes through to Kratos's readiness.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4455/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
    depends_on:
      postgres: { condition: service_healthy }
      kratos: { condition: service_healthy }

  api:
    <<: *app
    image: montra-dev/api:${MONTRA_IMAGE_TAG:-local}
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment: *api-environment
    # With Kratos, the secret its webhooks send (made by auth-init); with dev sign-in there's none.
    command:
      [
        'sh',
        '-c',
        'if [ "$$AUTH_MODE" = kratos ]; then export KRATOS_WEBHOOK_SECRET_FILE=/run/secrets/kratos_webhook_secret; fi; node -e "$$HOST_RELAY_JS" & exec node dist/main.js',
      ]
    ports: ['${MONTRA_API_PORT:-4040}:4000']
    volumes: [appstorage:/data/storage, authsecrets:/run/secrets:ro]
    healthcheck:
      <<: *health
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]

  worker:
    <<: *app
    image: montra-dev/api:${MONTRA_IMAGE_TAG:-local}
    environment: *api-environment
    command: ['sh', '-c', 'node -e "$$HOST_RELAY_JS" & exec node dist/worker-main.js']
    volumes: [appstorage:/data/storage]
    depends_on:
      api: { condition: service_healthy }

  doc-worker:
    <<: *app
    image: montra-dev/doc-worker:${MONTRA_IMAGE_TAG:-local}
    build: { context: .., dockerfile: apps/doc-worker/Dockerfile }
    # Only what the document worker reads (apps/doc-worker/src/montra_doc_worker/settings.py), not the whole .env.
    env_file: []
    environment:
      DATABASE_URL: postgres://montra_app:montra_app@postgres:5432/montra
      STORAGE_MODE: local
      STORAGE_DIR: /data/storage
      TZ: ${MONTRA_TZ:-}
    volumes: [appstorage:/data/storage]

  web:
    <<: *app
    image: montra-dev/web:${MONTRA_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # Compiled into the browser's code: build again after changing any of these.
      args:
        NEXT_PUBLIC_AUTH_MODE: ${MONTRA_AUTH_MODE:-kratos}
        NEXT_PUBLIC_KRATOS_URL: http://${MONTRA_PUBLIC_HOST:-localhost}:${MONTRA_AUTH_PORT:-4455}
        NEXT_PUBLIC_APP_URL: http://${MONTRA_PUBLIC_HOST:-localhost}:${MONTRA_WEB_PORT:-3030}
        NEXT_PUBLIC_API_WS_URL: ws://${MONTRA_PUBLIC_HOST:-localhost}:${MONTRA_API_PORT:-4040}/v1/ws
    env_file: []
    environment:
      API_URL: http://api:4000
      # The web server reads sessions and flows from Kratos directly, inside the Compose network.
      KRATOS_PUBLIC_URL: http://kratos:4433
      TZ: ${MONTRA_TZ:-}
      # Dev sign-in from another device on the network, over plain http (apps/web/lib/session.ts).
      DEV_COOKIE_INSECURE: 'on'
    ports: ['${MONTRA_WEB_PORT:-3030}:3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      <<: *health
      # The front page answers with a redirect in either mode (sign-in in Kratos mode goes on to the gateway).
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/', { redirect: 'manual' }).then((r) => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))",
        ]

volumes:
  appstorage:
  # The Kratos and gateway secrets, made by auth-init.
  authsecrets:
