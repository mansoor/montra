name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap database roles and test databases
        run: |
          for db in montra montra_test montra_test_api; do
            psql -v db=$db -f infra/db/bootstrap.sql
          done
      - name: Format
        run: pnpm format:check
      - name: Build, typecheck, lint, test
        run: pnpm turbo run build typecheck lint test --filter=!@montra/doc-worker
      - name: Requirements traceability is up to date
        run: |
          node scripts/gen-traceability.mjs
          git diff --exit-code docs/design/traceability.md

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: psql -v db=montra -f infra/db/bootstrap.sql
      - run: pnpm turbo run build --filter=@montra/api --filter=@montra/web
      - run: pnpm db:migrate
      - run: pnpm --filter @montra/web exec playwright install --with-deps chromium
      - name: Playwright (web + API, dev auth)
        run: pnpm --filter @montra/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  doc-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      # The tests apply packages/db/migrations to this empty database themselves (tests/conftest.py).
      DATABASE_URL: postgres://montra_app:montra_app@localhost:5432/montra_test_docworker
      DATABASE_ADMIN_URL: postgres://montra_owner:montra_owner@localhost:5432/montra_test_docworker
    defaults:
      run:
        working-directory: apps/doc-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/doc-worker/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Bootstrap database roles and the doc-worker test database
        run: psql -v db=montra_test_docworker -f ../../infra/db/bootstrap.sql
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m mypy
      - run: python -m pytest -q
