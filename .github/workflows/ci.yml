name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      # The S3 storage tests run against a real MinIO (apps/api/test/s3-minio.test.ts); required here, so a missing
      # server fails the run instead of skipping them.
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_ACCESS_KEY: montra
      S3_TEST_SECRET_KEY: montra-ci-secret
      S3_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A service container can't be given MinIO's `server` command, so it's started here.
      - name: Start MinIO for the S3 storage tests
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_TEST_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$S3_TEST_SECRET_KEY" \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && exit 0; sleep 1; done
          docker logs minio; exit 1
      - name: Bootstrap database roles and test databases
        run: |
          for db in montra montra_test montra_test_api; do
            psql -v db=$db -f infra/db/bootstrap.sql
          done
      - name: Format
        run: pnpm format:check
      - name: Build, typecheck, lint, test
        run: pnpm turbo run build typecheck lint test --filter=!@montra/doc-worker
      - name: Performance budgets (run alone)
        run: |
          pnpm --filter @montra/categorize test:perf
          pnpm --filter @montra/api test:perf
      - name: Requirements traceability is up to date
        run: |
          node scripts/gen-traceability.mjs
          git diff --exit-code docs/design/traceability.md

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: psql -v db=montra -f infra/db/bootstrap.sql
      - run: pnpm turbo run build --filter=@montra/api --filter=@montra/web
      - run: pnpm db:migrate
      - run: pnpm --filter @montra/web exec playwright install --with-deps chromium
      - name: Playwright (web + API, dev auth)
        run: pnpm --filter @montra/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  doc-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      # The tests apply packages/db/migrations to this empty database themselves (tests/conftest.py).
      DATABASE_URL: postgres://montra_app:montra_app@localhost:5432/montra_test_docworker
      DATABASE_ADMIN_URL: postgres://montra_owner:montra_owner@localhost:5432/montra_test_docworker
    defaults:
      run:
        working-directory: apps/doc-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/doc-worker/pyproject.toml
      - name: Install Tesseract (scanned-PDF OCR tests run for real)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: pip install -e ".[dev]"
      - name: Bootstrap database roles and the doc-worker test database
        run: psql -v db=montra_test_docworker -f ../../infra/db/bootstrap.sql
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m mypy
      - run: python -m pytest -q
        env:
          REQUIRE_TESSERACT: '1'
