name: Mobile

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [development, preview, production]
        default: preview
      platform:
        description: Platform
        type: choice
        options: [all, ios, android]
        default: all

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @montra/mobile typecheck
      - run: pnpm --filter @montra/mobile lint
      - run: pnpm --filter @montra/mobile test
      - name: Bundle JavaScript for both platforms (no device needed)
        working-directory: apps/mobile
        run: |
          npx expo config --type prebuild > /dev/null
          npx expo export --platform ios --output-dir dist/ios
          npx expo export --platform android --output-dir dist/android
          du -sh dist/ios/_expo dist/android/_expo

  eas-build:
    if: github.event_name == 'workflow_dispatch'
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check for an Expo token
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN is not set; skipping the EAS build. Add it under Settings → Secrets → Actions."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.token.outputs.present == 'true'
      - uses: expo/expo-github-action@v8
        if: steps.token.outputs.present == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS build
        if: steps.token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          MONTRA_API_URL: ${{ vars.MONTRA_API_URL }}
          MONTRA_KRATOS_URL: ${{ vars.MONTRA_KRATOS_URL }}
        run: eas build --non-interactive --no-wait --profile ${{ inputs.profile }} --platform ${{ inputs.platform }}
