name: Deploy

# Tags pick the environment: vX.Y.Z-dev.N goes to dev, vX.Y.Z-rc.N to staging, vX.Y.Z to prod. Each GitHub environment
# needs the variables AWS_ROLE_ARN and AWS_REGION. Add required reviewers on the prod environment.
# See docs/runbooks/deploy.md. This workflow has not been run against a real AWS account yet.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options: [dev, staging, prod]
        default: dev
      build_only:
        description: Build and push images only. Used once, before the first full Terraform apply.
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  target:
    name: Choose the environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.environment }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "environment=$INPUT" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag $TAG doesn't name a release"
            exit 1
          fi

  gate:
    name: Check for an AWS role
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ needs.target.outputs.environment }}
    outputs:
      configured: ${{ steps.role.outputs.configured }}
    steps:
      - id: role
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::notice::AWS_ROLE_ARN is not set for this environment; skipping the deployment. Add it under Settings → Environments."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  images:
    name: Build and push images
    needs: [target, gate]
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.target.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Production deploys only from main
        if: needs.target.outputs.environment == 'prod'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main, and production only runs released versions."
            exit 1
          fi
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Read the deploy settings
        env:
          ENVIRONMENT: ${{ needs.target.outputs.environment }}
        run: |
          aws ssm get-parameter --name "/montra-$ENVIRONMENT/deploy-config" \
            --query Parameter.Value --output text > "$RUNNER_TEMP/deploy-config.json"
      - name: Build and push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          config="$RUNNER_TEMP/deploy-config.json"
          repo() { jq -r --arg r "$1" '.repositories[$r]' "$config"; }
          docker buildx build --push -f apps/api/Dockerfile -t "$(repo api):$TAG" .
          docker buildx build --push -f apps/doc-worker/Dockerfile -t "$(repo doc-worker):$TAG" .
          docker buildx build --push -t "$(repo kratos):$TAG" infra/kratos
          # NEXT_PUBLIC_* values are compiled into the browser bundle, so web is built per environment.
          mapfile -t build_args < <(jq -r '.webBuildArgs | to_entries[] | "--build-arg=\(.key)=\(.value)"' "$config")
          docker buildx build --push -f apps/web/Dockerfile "${build_args[@]}" -t "$(repo web):$TAG" .

  deploy:
    name: Migrate and deploy
    needs: [target, gate, images]
    if: needs.gate.outputs.configured == 'true' && !inputs.build_only
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ needs.target.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.images.outputs.tag }}
      ENVIRONMENT: ${{ needs.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
      - name: Read the deploy settings
        run: |
          aws ssm get-parameter --name "/montra-$ENVIRONMENT/deploy-config" \
            --query Parameter.Value --output text > "$RUNNER_TEMP/deploy-config.json"
          {
            echo "CONFIG=$RUNNER_TEMP/deploy-config.json"
            echo "API_IMAGE=$(jq -r '.repositories.api' "$RUNNER_TEMP/deploy-config.json"):$TAG"
            echo "WEB_IMAGE=$(jq -r '.repositories.web' "$RUNNER_TEMP/deploy-config.json"):$TAG"
            echo "DOC_IMAGE=$(jq -r '.repositories["doc-worker"]' "$RUNNER_TEMP/deploy-config.json"):$TAG"
            echo "KRATOS_IMAGE=$(jq -r '.repositories.kratos' "$RUNNER_TEMP/deploy-config.json"):$TAG"
          } >> "$GITHUB_ENV"
      - name: Migrate the identity database
        run: bash infra/deploy/ecs-run-task.sh "$CONFIG" "$(jq -r .kratosMigrate "$CONFIG")" "$KRATOS_IMAGE"
      - name: Migrate the ledger database as the owner role
        run: bash infra/deploy/ecs-run-task.sh "$CONFIG" "$(jq -r .migrate "$CONFIG")" "$API_IMAGE"
      - name: Roll out Kratos and the auth gateway in front of it
        run: |
          bash infra/deploy/ecs-deploy-rolling.sh "$CONFIG" kratos "$KRATOS_IMAGE"
          bash infra/deploy/ecs-deploy-rolling.sh "$CONFIG" kratos-courier "$KRATOS_IMAGE"
          bash infra/deploy/ecs-deploy-rolling.sh "$CONFIG" auth-gateway "$API_IMAGE"
      - name: Roll out the workers
        run: |
          bash infra/deploy/ecs-deploy-rolling.sh "$CONFIG" worker "$API_IMAGE"
          bash infra/deploy/ecs-deploy-rolling.sh "$CONFIG" doc-worker "$DOC_IMAGE"
      - name: Blue/green API
        run: bash infra/deploy/ecs-deploy-blue-green.sh "$CONFIG" api "$API_IMAGE"
      - name: Blue/green web
        run: bash infra/deploy/ecs-deploy-blue-green.sh "$CONFIG" web "$WEB_IMAGE"
