name: Terraform

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [develop]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Format
        run: terraform fmt -check -recursive infra/terraform
      - name: Init without a backend
        run: terraform -chdir=infra/terraform/envs/${{ matrix.environment }} init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=infra/terraform/envs/${{ matrix.environment }} validate
